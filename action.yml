name: OSS Health Check
description: Check repository readiness and publish a health report to the job summary.
author: HPnetwork
inputs:
  path:
    description: Repository path to scan.
    required: false
    default: .
  strict:
    description: Fail the job when a secret is detected.
    required: false
    default: 'true'
  min-score:
    description: Fail the job when the repository score is below this value (0-100).
    required: false
    default: '0'
  format:
    description: Report format: markdown or sarif.
    required: false
    default: markdown
  upload-sarif:
    description: Upload a SARIF report to code scanning when format is sarif.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Run repository checks
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_MIN_SCORE: ${{ inputs['min-score'] }}
      run: |
        set -o pipefail
        args=("$INPUT_PATH" --format "${{ inputs.format }}")
        if [[ "$INPUT_STRICT" == "true" ]]; then args+=(--strict); fi
        if [[ -n "$INPUT_MIN_SCORE" && "$INPUT_MIN_SCORE" != "0" ]]; then args+=(--min-score "$INPUT_MIN_SCORE"); fi
        python3 -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH"
        python3 -m oss_health_check "${args[@]}" | tee "/tmp/oss-health-check.${{ inputs.format }}"
        if [[ "${{ inputs.format }}" == "markdown" ]]; then
          cat /tmp/oss-health-check.markdown >> "$GITHUB_STEP_SUMMARY"
        fi
    - if: always() && (inputs.format == 'sarif' && inputs['upload-sarif'] == 'true')
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: /tmp/oss-health-check.sarif
